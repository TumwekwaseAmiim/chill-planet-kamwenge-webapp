<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin Login — Chill Planet
  </title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

</head>


<body>


  <main class="auth-shell">


    <section class="glass-card auth-card">


      <!-- BRAND -->

      <a
        class="brand"
        href="../index.html"
      >

        <span class="brand-orb">
          CP
        </span>

        <span>
          CHILL PLANET
        </span>

      </a>


      <!-- HEADER -->

      <span class="eyebrow">
        ADMIN CONTROL
      </span>

      <h1>
        Sign in
      </h1>

      <p class="muted">
        Sign in with your authorized Chill Planet administrator account.
      </p>


      <!-- LOGIN FORM -->

      <form id="loginForm">


        <label>

          Email

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Admin email"
            required
          >

        </label>


        <label>

          Password

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            required
          >

        </label>


        <button
          class="btn btn-primary"
          type="submit"
        >
          Enter Dashboard
        </button>


      </form>


      <!-- LOGIN MESSAGE -->

      <p
        id="loginMessage"
        class="feedback"
        aria-live="polite"
      ></p>


      <!-- BACK HOME -->

      <div
        class="inline-actions"
        style="margin-top: 18px;"
      >

        <a
          href="../index.html"
          class="btn btn-small btn-ghost"
        >
          ← Back to Chill Planet
        </a>

      </div>


    </section>


  </main>


  <!-- CACHE-BUSTED ADMIN LOGIN SCRIPT -->

  <script
    type="module"
    src="../js/auth.js"
  ></script>


</body>

</html>
